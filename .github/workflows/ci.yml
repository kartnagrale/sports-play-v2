name: Play-Neml verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: phase1-ci-only
          POSTGRES_DB: phase1
        ports: ['55441:5432']
        options: >-
          --health-cmd "pg_isready -U phase1 -d phase1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '55441'
      PGDATABASE: phase1
      PGUSER: phase1
      PGPASSWORD: phase1-ci-only
      PHASE1_DB_URL: jdbc:postgresql://127.0.0.1:55441/phase1?currentSchema=play_neml
      PHASE1_DB_PASSWORD: phase1-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Initialize disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/sports-play-complete-schema.sql
      - name: Apply tracked migration
        shell: pwsh
        run: ./tools/apply-migrations.ps1
      - name: Backend including PostgreSQL integration tests
        working-directory: backend
        run: ./mvnw -B verify
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high
