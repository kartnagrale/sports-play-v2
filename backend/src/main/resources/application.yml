server:
  port: 8001
  servlet:
    context-path: /

spring:
  application:
    name: neml-badminton
  datasource:
    url: ${DB_URL:jdbc:postgresql://uat-auction-hyd-cluster.cluster-cqiizwijdxjv.ap-south-2.rds.amazonaws.com:1521/postgres?currentSchema=play_neml&lock_timeout=300&idle_in_transaction_session_timeout=10000}
    username: ${DB_USER:participant-masterv2_replica}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:neml-badminton-super-secret-key-change-in-production-min-256-bits-required-here}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  auction:
    base-price: 2000000
    team-purse: 1000000000
    squad-size: 12
    min-female: 3
    min-male: 9
    bid-increment: 500000
    timer-seconds: 30
    star-player-threshold: 50000000
    max-star-players: 4

logging:
  level:
    org.springframework.security: INFO
    com.neml.badminton: INFO
    org.hibernate.SQL: WARN