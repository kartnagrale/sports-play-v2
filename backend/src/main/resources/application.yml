server:
  port: 8001
  servlet:
    context-path: /

spring:
  application:
    name: neml-badminton
  sql:
    init:
      mode: never
  datasource:

    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000
      # Session-only setting; this does not create or modify any schema.
      connection-init-sql: "SET search_path TO play_neml"
  jpa:
    generate-ddl: false
    open-in-view: false
    hibernate:
      # Validation is read-only. All DDL is generated for manual review and
      # execution by the company database owner.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: play_neml
        hbm2ddl:
          create_namespaces: false
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  seed:
    enabled: ${DATA_SEED_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:neml-badminton-super-secret-key-change-in-production-min-256-bits-required-here}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
logging:
  level:
    org.springframework.security: INFO
    com.neml.badminton: INFO
    org.hibernate.SQL: WARN
