server:
  port: 8001
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: neml-badminton
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000
      # Session-only setting; this does not create or modify any schema.
      connection-init-sql: "SET search_path TO play_neml"
  jpa:
    generate-ddl: false
    open-in-view: false
    hibernate:
      # Validation is read-only. All DDL is generated for manual review and
      # execution by the company database owner.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: play_neml
        hbm2ddl:
          create_namespaces: false
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  certificates:
    public-enabled: ${CERTIFICATES_PUBLIC_ENABLED:false}
    public-base-url: ${CERTIFICATES_PUBLIC_BASE_URL:}
  players:
    photo:
      directory: ${PLAYER_PHOTO_DIR:./var/player-photos}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    activation-lifetime: ${ACTIVATION_LIFETIME:PT30M}
    rate-limit-attempts: ${AUTH_RATE_LIMIT_ATTEMPTS:300}
  seed:
    enabled: ${DATA_SEED_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
    com.neml.badminton: INFO
    org.hibernate.SQL: WARN
