# Always select a project explicitly: docker compose --env-file <private.env> -p <project> ...
x-db-image: &db-image
  image: ${COMPOSE_PROJECT_NAME:?Select a unique Compose project}-db:phase6.5
  build:
    context: .
    dockerfile: docker/database/Dockerfile
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    <<: *db-image
    labels: {purpose: play-neml-phase6.5}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_play}
      POSTGRES_USER: ${POSTGRES_USER:-sports_play_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Supply a database owner password}
      APP_DB_USER: ${DB_USER:-sports_play_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Supply a separate application database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      # Init uses a temporary Unix-socket server; wait for the final TCP server.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  migrate:
    <<: *db-image
    user: postgres
    restart: "no"
    entrypoint: [sh, /opt/play-neml/migrate.sh]
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sports_play}
      POSTGRES_USER: ${POSTGRES_USER:-sports_play_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Supply a database owner password}
      APP_DB_USER: ${DB_USER:-sports_play_app}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  backend:
    labels: {purpose: play-neml-phase6.5}
    image: ${COMPOSE_PROJECT_NAME:?Select a unique Compose project}-backend:phase6.5
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sports_play}?currentSchema=play_neml&lock_timeout=300&idle_in_transaction_session_timeout=10000
      DB_USER: ${DB_USER:-sports_play_app}
      DB_PASSWORD: ${DB_PASSWORD:?Supply a separate application database password}
      JWT_SECRET: ${JWT_SECRET:?Supply at least 64 random characters}
      DATA_SEED_ENABLED: "false"
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_EMAIL: ${APP_BOOTSTRAP_EMAIL:-}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Supply the exact browser origin}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PLAYER_PHOTO_DIR: /app/var/player-photos
      LOG_PATH: /app/logs
      CERTIFICATES_PUBLIC_ENABLED: ${CERTIFICATES_PUBLIC_ENABLED:-false}
      CERTIFICATES_PUBLIC_BASE_URL: ${CERTIFICATES_PUBLIC_BASE_URL:-}
    volumes:
      - player_photos:/app/var/player-photos
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/logs:rw,noexec,nosuid,uid=10001,gid=10001,size=64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [application, database]
    logging: *logging
  frontend:
    image: ${COMPOSE_PROJECT_NAME:?Select a unique Compose project}-frontend:phase6.5
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    logging: *logging
  gateway:
    image: ${COMPOSE_PROJECT_NAME:?Select a unique Compose project}-gateway:phase6.5
    build:
      context: ./docker/gateway
    restart: unless-stopped
    environment:
      # Fixed by the trusted operator; never trust a caller's forwarded headers.
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101,size=1m
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge, application]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
networks:
  edge:
  application:
    internal: true
  database:
    internal: true
volumes:
  postgres_data:
    labels: {purpose: play-neml-phase6.5}
  player_photos:
    labels: {purpose: play-neml-phase6.5}
